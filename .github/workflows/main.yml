
name: Build SD Management APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
                with:
          packages: "platform-tools"

      - name: Accept licenses and install SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERROR: Project ZIP not found in repository root"
            exit 1
          fi
          mkdir -p project
          unzip -o "$ZIP" -d project
          ROOT=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$ROOT" ]; then
            echo "ERROR: Gradle settings file not found inside ZIP"
            find project -maxdepth 3 -type f | head -n 50
            exit 1
          fi
          echo "PROJECT_ROOT=$(dirname "$ROOT")" >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          cd "$PROJECT_ROOT"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SD-Management-debug-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
